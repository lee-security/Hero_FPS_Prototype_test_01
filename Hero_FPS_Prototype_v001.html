<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON TANKER FPS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Teko', sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        
        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 24px; height: 24px;
            transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background-color: rgba(0, 255, 255, 0.8);
        }
        #crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
        #crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }
        #crosshair-center {
            position: absolute; top: 10px; left: 10px; width: 4px; height: 4px;
            background-color: #00ffff; border-radius: 50%;
        }

        /* Bottom Left: Health Portrait */
        #health-section {
            position: absolute; bottom: 30px; left: 40px; display: flex; align-items: flex-end;
        }
        #portrait-frame {
            width: 100px; height: 100px; background: rgba(0, 240, 255, 0.2);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border: 3px solid #00ffff; position: relative; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }
        #portrait-img {
            font-size: 50px; color: white;
        }
        #health-info { margin-left: 20px; margin-bottom: 10px; }
        #health-numbers { font-size: 48px; color: white; font-style: italic; line-height: 1; text-shadow: 2px 2px 0 #000; }
        #health-numbers span { font-size: 28px; color: #ccc; }
        #health-bar-bg { width: 250px; height: 18px; background: rgba(255,255,255,0.2); transform: skewX(-15deg); margin-top: 5px; border: 1px solid #fff; }
        #health-bar-fill { width: 100%; height: 100%; background: #00ffff; transition: width 0.1s, background-color 0.2s; box-shadow: 0 0 10px #00ffff; }

        /* Bottom Center: Ultimate Meter */
        #ult-section {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center;
        }
        #ult-circle-bg {
            width: 95px; height: 95px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center; position: relative; background: rgba(0,0,0,0.6);
            transition: all 0.3s;
        }
        #ult-circle-fill-container {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
        }
        #ult-circle-fill {
            position: absolute; bottom: 0; width: 100%; height: 0%; background: #ff5500; transition: height 0.2s;
        }
        #ult-icon {
            position: relative; z-index: 2; font-size: 40px; color: white; opacity: 0.8;
        }
        #ult-number { font-size: 34px; font-weight: bold; font-style: italic; color: white; text-shadow: 1px 1px 3px #000; z-index: 2; position: absolute;}
        .ult-ready #ult-circle-bg { border-color: #ff3300; box-shadow: 0 0 25px #ff5500, inset 0 0 15px #ff5500; transform: scale(1.1); }
        .ult-ready #ult-circle-fill { background: #ff3300; }
        .ult-ready #ult-number { display: none; }
        .ult-ready #ult-icon { opacity: 1; color: #fff; text-shadow: 0 0 12px #ff5500; display: block !important; animation: pulse 1s infinite alternate; }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* Bottom Right: Ammo & Skills */
        #weapon-section {
            position: absolute; bottom: 30px; right: 40px; display: flex; align-items: flex-end;
        }
        .skill-container {
            display: flex; gap: 15px; margin-right: 30px; margin-bottom: 15px;
        }
        .skill-slot {
            width: 55px; height: 55px; background: rgba(20, 20, 30, 0.8); border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 6px; position: relative; display: flex; justify-content: center; align-items: center;
            font-size: 26px; color: white; box-shadow: 0 0 8px rgba(0,255,255,0.2);
        }
        .skill-key { position: absolute; bottom: -20px; font-size: 16px; color: #00ffff; font-weight: bold; width: 100%; text-align: center; text-shadow: 0 0 5px rgba(0,255,255,0.5); }
        .cooldown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            color: #ff3300; display: flex; justify-content: center; align-items: center; font-size: 26px;
            font-weight: bold; border-radius: 4px; display: none; border: 1px solid #ff3300;
        }
        #ammo-info { text-align: right; }
        #ammo-numbers { font-size: 60px; color: white; font-style: italic; line-height: 0.8; text-shadow: 2px 2px 0 #000; }
        #ammo-numbers span { font-size: 30px; color: #ccc; }
        #weapon-icon { font-size: 24px; color: white; margin-top: 5px; display: flex; justify-content: flex-end;}

        /* Menu Screens */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 100; pointer-events: auto;
        }
        h1 { font-size: 5.5em; font-style: italic; color: #00ffff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 20px rgba(0,255,255,0.5); }
        .menu-box {
            background: rgba(20, 20, 30, 0.95); padding: 35px; border-left: 5px solid #00ffff;
            min-width: 450px; border-radius: 0 10px 10px 0; box-shadow: 0 0 30px rgba(0,255,255,0.15);
        }
        .menu-btn {
            display: block; width: 100%; padding: 15px; margin-top: 15px; font-size: 24px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,255,0.3); color: white; font-family: inherit;
            cursor: pointer; transition: all 0.2s; text-align: left; font-style: italic;
        }
        .menu-btn:hover { background: #00ffff; color: black; padding-left: 25px; font-weight: bold; box-shadow: 0 0 15px #00ffff; }
        
        .controls-list { list-style: none; padding: 0; font-size: 20px; color: #ccc; margin-bottom: 20px;}
        .controls-list li { margin: 8px 0; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,255,255,0.1); padding-bottom: 5px;}
        .key-tag { color: #00ffff; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,255,0.5); }

        #bot-control { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(0,255,255,0.2); }
        .bot-btn { background: #222; border: 1px solid #00ffff; color: #00ffff; width: 40px; height: 40px; font-size: 24px; cursor: pointer; border-radius: 5px; transition: all 0.2s;}
        .bot-btn:hover { background: #00ffff; color: black; box-shadow: 0 0 10px #00ffff; }

        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px rgba(255,0,0,0);
            transition: box-shadow 0.1s; pointer-events: none; z-index: 5;
        }
        #slow-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 120px rgba(170, 0, 255, 0);
            transition: box-shadow 0.2s; pointer-events: none; z-index: 4;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay-screen">
        <h1>NEON TANKER</h1>
        <div class="menu-box">
            <ul class="controls-list">
                <li><span>이동</span> <span class="key-tag">W A S D</span></li>
                <li><span>점프 (2층 도달 가능)</span> <span class="key-tag">SPACE</span></li>
                <li><span>사격 (거리별 데미지 다름)</span> <span class="key-tag">좌클릭</span></li>
                <li><span>갈고리 (코앞으로 견인)</span> <span class="key-tag">우클릭</span></li>
                <li><span>돌진 (조준 방향 돌격)</span> <span class="key-tag">L-SHIFT</span></li>
                <li><span>둔화탄 (상대 슬로우)</span> <span class="key-tag">E</span></li>
                <li><span>근접 공격 (넉백)</span> <span class="key-tag">V</span></li>
                <li><span>장전</span> <span class="key-tag">R</span></li>
                <li><span>궁극기 (원형 범위 폭격)</span> <span class="key-tag">Q</span></li>
            </ul>
            <button id="start-btn" class="menu-btn">게임 시작 (ENTER)</button>
        </div>
    </div>

    <!-- Pause/Option Menu -->
    <div id="pause-screen" class="overlay-screen" style="display: none;">
        <h1>일시 정지</h1>
        <div class="menu-box">
            <button id="resume-btn" class="menu-btn">게임으로 돌아가기</button>
            <div id="bot-control">
                <span style="font-size: 24px; color: #ccc;">적 봇 수량: <span id="bot-count-text" style="color: #00ffff; font-weight:bold; text-shadow: 0 0 5px #00ffff;">3</span></span>
                <div>
                    <button id="rem-bot-btn" class="bot-btn">-</button>
                    <button id="add-bot-btn" class="bot-btn">+</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Game UI -->
    <div id="ui-layer">
        <div id="crosshair"><div id="crosshair-center"></div></div>
        <div id="damage-overlay"></div>
        <div id="slow-overlay"></div>
        
        <!-- Health -->
        <div id="health-section">
            <div id="portrait-frame"><div id="portrait-img">🛡️</div></div>
            <div id="health-info">
                <div id="health-numbers">300<span>/300</span></div>
                <div id="health-bar-bg"><div id="health-bar-fill"></div></div>
            </div>
        </div>

        <!-- Ultimate -->
        <div id="ult-section">
            <div id="ult-circle-bg">
                <div id="ult-circle-fill-container"><div id="ult-circle-fill"></div></div>
                <div id="ult-number">0</div>
                <div id="ult-icon" style="display:none;">⚡</div>
            </div>
        </div>

        <!-- Weapons & Skills -->
        <div id="weapon-section">
            <div class="skill-container">
                <div class="skill-slot">
                    ⏩
                    <div class="skill-key">L-SHIFT</div>
                    <div id="cd-charge" class="cooldown-overlay"></div>
                </div>
                <div class="skill-slot">
                    ⚓
                    <div class="skill-key">R-CLICK</div>
                    <div id="cd-hook" class="cooldown-overlay"></div>
                </div>
                <div class="skill-slot">
                    ❄️
                    <div class="skill-key">E</div>
                    <div id="cd-slow" class="cooldown-overlay"></div>
                </div>
                <div class="skill-slot">
                    👊
                    <div class="skill-key">V</div>
                    <div id="cd-melee" class="cooldown-overlay"></div>
                </div>
            </div>
            
            <div id="ammo-info">
                <div id="ammo-numbers">25<span>/25</span></div>
                <div id="weapon-icon">🔫</div>
            </div>
        </div>
    </div>

    <script>
        // Three.js Variables
        let scene, camera, renderer;
        let weaponGroup, muzzleFlash, slashMesh;
        let lastTime = performance.now();
        
        // Player State
        const player = {
            maxHealth: 300,
            health: 300,
            ammo: 25,
            maxAmmo: 25,
            isReloading: false,
            ultCharge: 0,
            isUltActive: false,
            ultTimer: 0,
            
            // Movement
            velocity: new THREE.Vector3(),
            direction: new THREE.Vector3(),
            radius: 1.2, 
            height: 3.0,
            canJump: true,
            
            // Skills State
            isCharging: false,
            chargeTimer: 0,
            chargeTarget: null,
            cooldowns: {
                charge: 0,
                hook: 0,
                melee: 0,
                slow: 0
            },
            maxCooldowns: {
                charge: 7.0,
                hook: 6.0,
                melee: 1.0,
                slow: 10.0
            }
        };

        const moveState = { forward: false, backward: false, left: false, right: false };
        
        // Entities
        const bots = [];
        const projectiles = [];
        const particles = [];
        const walls = [];

        // Game Constants
        const MAP_SIZE = 140;
        const GRAVITY = 36;
        let isLocked = false;
        let isPaused = false;
        
        init();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a14, 0.008); 
            scene.background = new THREE.Color(0x0a0a14);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, player.height, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Cyberpunk Neon Lighting
            const ambientLight = new THREE.AmbientLight(0x221144, 0.8);
            scene.add(ambientLight);

            const neonLight1 = new THREE.DirectionalLight(0x00ffff, 0.8);
            neonLight1.position.set(50, 100, 50);
            scene.add(neonLight1);

            const neonLight2 = new THREE.DirectionalLight(0xff00aa, 0.6);
            neonLight2.position.set(-50, 100, -50);
            scene.add(neonLight2);

            buildEnvironment();
            createWeapon();

            // Initial Bots
            for(let i = 0; i < 3; i++) spawnBot();

            setupEventListeners();
            updateUI();
        }

        function getGroundY(pos, radius) {
            let highestY = 0;
            const px = pos.x;
            const pz = pos.z;
            const r = radius;

            for(let w of walls) {
                // If the player's horizontal footprint overlaps with the wall Box3
                if (px + r > w.min.x && px - r < w.max.x && pz + r > w.min.z && pz - r < w.max.z) {
                    if (w.max.y <= pos.y + 0.5) { // Only count walls below player
                        if (w.max.y > highestY) {
                            highestY = w.max.y;
                        }
                    }
                }
            }
            return highestY;
        }

        function buildEnvironment() {
            // Dark Grid Floor
            const floorGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x111122, 
                roughness: 0.9,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Floor Neon Grid Helpers (Cyberpunk feeling)
            const gridHelper = new THREE.GridHelper(MAP_SIZE, 70, 0x00ffff, 0x442266);
            gridHelper.position.y = 0.02;
            scene.add(gridHelper);

            // Wall Materials
            const wallMat1 = new THREE.MeshStandardMaterial({ color: 0x1b1b2f, roughness: 0.6, metalness: 0.8 }); // Steel Plates
            const wallMat2 = new THREE.MeshStandardMaterial({ color: 0x0d0d1a, roughness: 0.5, metalness: 0.9 }); // Dark Alloy
            const neonMagenta = new THREE.MeshBasicMaterial({ color: 0xff00aa });
            const neonCyan = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            // Outer Boundary Walls
            createBoxCollider(MAP_SIZE, 30, 2, 0, 15, -MAP_SIZE/2, wallMat1); // N
            createBoxCollider(MAP_SIZE, 30, 2, 0, 15, MAP_SIZE/2, wallMat1);  // S
            createBoxCollider(2, 30, MAP_SIZE, -MAP_SIZE/2, 15, 0, wallMat1); // W
            createBoxCollider(2, 30, MAP_SIZE, MAP_SIZE/2, 15, 0, wallMat1);  // E

            // 2ND FLOOR - Giant Catwalk Platforms
            // Height = 10m
            createBoxCollider(50, 1.5, 40, -35, 10, -30, wallMat2); // NW High Platform
            createBoxCollider(50, 1.5, 40, 35, 10, 30, wallMat2);  // SE High Platform
            createBoxCollider(15, 1.5, 90, 0, 9, 0, wallMat2);    // Central High Bridge

            // Neon Signposts/Structures for 2nd Floor Decor
            createBoxCollider(1, 15, 1, -35, 17.5, -30, neonMagenta);
            createBoxCollider(1, 15, 1, 35, 17.5, 30, neonCyan);

            // JUMP STEPS / PLATFORMS (To reach 2nd Floor easily)
            // Left Side Staircase Structures
            createBoxCollider(6, 2.0, 6, -55, 1.0, 0, wallMat1);
            createBoxCollider(6, 4.0, 6, -55, 2.0, -8, wallMat1);
            createBoxCollider(6, 6.0, 6, -55, 3.0, -16, wallMat1);
            createBoxCollider(6, 8.0, 6, -55, 4.0, -24, wallMat1);
            createBoxCollider(6, 10.0, 6, -45, 5.0, -30, wallMat1); // Stair link to NW High Platform

            // Right Side Diagonal Pillars to hop on
            createBoxCollider(5, 3.0, 5, 15, 1.5, 10, wallMat1);
            createBoxCollider(5, 6.0, 5, 20, 3.0, 18, wallMat1);
            createBoxCollider(5, 9.0, 5, 25, 4.5, 26, wallMat1);

            // Central Pillars / Obstacles on Ground
            createBoxCollider(12, 16, 12, -20, 8, 20, wallMat1);
            createBoxCollider(12, 16, 12, 20, 8, -20, wallMat1);

            // Small glowing cover blocks
            const coverMat = new THREE.MeshStandardMaterial({ color: 0x050515, roughness: 0.3 });
            for(let i=0; i<6; i++) {
                const x = (Math.random() - 0.5) * 80;
                const z = (Math.random() - 0.5) * 80;
                if(Math.abs(x) < 15 && Math.abs(z) < 15) continue;
                createBoxCollider(4, 4, 4, x, 2, z, coverMat);
                // Glowing border
                createBoxCollider(4.2, 0.1, 4.2, x, 4, z, Math.random() > 0.5 ? neonMagenta : neonCyan);
            }
        }

        function createBoxCollider(w, h, d, x, y, z, material) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            
            const box3 = new THREE.Box3().setFromObject(mesh);
            walls.push(box3);
        }

        function createWeapon() {
            weaponGroup = new THREE.Group();
            
            // Cyberpunk Heavy Cannon Body
            const bodyGeo = new THREE.BoxGeometry(0.35, 0.45, 1.6);
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, darkMat);
            
            // Neon Line on Gun
            const neonLineGeo = new THREE.BoxGeometry(0.02, 0.08, 1.2);
            const neonLineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const neonLine = new THREE.Mesh(neonLineGeo, neonLineMat);
            neonLine.position.set(0.18, 0.1, -0.2);
            body.add(neonLine);
            
            // Triple Barrel
            const barrelGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.1, 6);
            const silverMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, metalness: 0.9, roughness: 0.1 });
            const barrel1 = new THREE.Mesh(barrelGeo, silverMat);
            barrel1.rotation.x = Math.PI / 2;
            barrel1.position.set(0, 0.08, -1.0);

            // Muzzle Flash
            const flashGeo = new THREE.PlaneGeometry(0.8, 0.8);
            const flashMat = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide
            });
            muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
            muzzleFlash.position.set(0, 0.08, -1.6);
            
            weaponGroup.add(body);
            weaponGroup.add(barrel1);
            weaponGroup.add(muzzleFlash);

            // Melee Slash Crescent Effect (Hidden by default)
            const slashGeo = new THREE.RingGeometry(0.8, 1.6, 32, 1, 0, Math.PI);
            const slashMat = new THREE.MeshBasicMaterial({ color: 0xff4400, side: THREE.DoubleSide, transparent: true, opacity: 0 });
            slashMesh = new THREE.Mesh(slashGeo, slashMat);
            slashMesh.position.set(0, 0, -2.0);
            slashMesh.rotation.x = Math.PI / 2;
            camera.add(slashMesh);

            // Position relative to camera
            weaponGroup.position.set(0.55, -0.45, -1.1);
            camera.add(weaponGroup);
            scene.add(camera);
        }

        function spawnBot() {
            const botGroup = new THREE.Group();

            // Hover Mech Body (Sphere & Cylinders)
            const bodyGeo = new THREE.SphereGeometry(1.0, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdd1144, metalness: 0.7, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.2;
            body.castShadow = true;
            botGroup.add(body);
            
            // Head with Glowing Cyber Eye
            const headGeo = new THREE.BoxGeometry(0.9, 0.6, 0.9);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.5 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.1;
            botGroup.add(head);
            
            const eyeGeo = new THREE.PlaneGeometry(0.7, 0.15);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const eye = new THREE.Mesh(eyeGeo, eyeMat);
            eye.position.set(0, 2.1, 0.46);
            botGroup.add(eye);

            // Glow base ring instead of legs
            const ringGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.2, 12);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = 0.2;
            botGroup.add(ring);

            // --- BILLBOARD HEALTH BAR ON TOP OF BOT ---
            const hpGroup = new THREE.Group();
            hpGroup.position.set(0, 2.8, 0);
            botGroup.add(hpGroup);

            // HP Background
            const hpBgGeo = new THREE.PlaneGeometry(1.4, 0.16);
            const hpBgMat = new THREE.MeshBasicMaterial({ color: 0x222233, side: THREE.DoubleSide });
            const hpBg = new THREE.Mesh(hpBgGeo, hpBgMat);
            hpGroup.add(hpBg);

            // HP Fill (Shifted Anchor to Left for proper Scaling)
            const hpFgGeo = new THREE.PlaneGeometry(1.4, 0.16);
            hpFgGeo.translate(0.7, 0, 0); // shift pivot
            const hpFgMat = new THREE.MeshBasicMaterial({ color: 0xff2222, side: THREE.DoubleSide });
            const hpFg = new THREE.Mesh(hpFgGeo, hpFgMat);
            hpFg.position.set(-0.7, 0, 0.01); // stack slightly in front
            hpGroup.add(hpFg);

            // Spawning positioning avoiding obstacles
            let validPos = false;
            let x, z, y;
            const testBox = new THREE.Box3();
            while(!validPos) {
                x = (Math.random() - 0.5) * (MAP_SIZE - 20);
                z = (Math.random() - 0.5) * (MAP_SIZE - 20);
                y = getGroundY(new THREE.Vector3(x, 20, z), 1.2);
                
                testBox.setFromCenterAndSize(new THREE.Vector3(x, y + 1.5, z), new THREE.Vector3(3, 4, 3));
                validPos = true;
                for(let w of walls) {
                    if(testBox.intersectsBox(w)) { validPos = false; break; }
                }
            }

            botGroup.position.set(x, y, z);
            scene.add(botGroup);

            bots.push({
                mesh: botGroup,
                health: 300,
                maxHealth: 300,
                radius: 1.2,
                height: 3.0,
                velocity: new THREE.Vector3(),
                
                // States
                isPinned: false,
                isPulled: false,
                pullStart: new THREE.Vector3(),
                pullTimer: 0,
                pullDuration: 0.45,
                
                slowTimer: 0,
                slowFactor: 1.0,
                
                moveTimer: 0,
                targetDir: new THREE.Vector3(1,0,0),
                
                // UI references
                hpGroup: hpGroup,
                hpFg: hpFg,
                bodyMat: bodyMat,
                headMat: headMat
            });
            updateBotCountUI();
        }

        function removeBot() {
            if(bots.length > 0) {
                const bot = bots.pop();
                scene.remove(bot.mesh);
                updateBotCountUI();
            }
        }

        function setupEventListeners() {
            const startBtn = document.getElementById('start-btn');
            const resumeBtn = document.getElementById('resume-btn');
            
            const lockPointer = () => document.body.requestPointerLock();
            startBtn.addEventListener('click', lockPointer);
            resumeBtn.addEventListener('click', lockPointer);

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isLocked = true;
                    isPaused = false;
                    document.getElementById('start-screen').style.display = 'none';
                    document.getElementById('pause-screen').style.display = 'none';
                    document.getElementById('ui-layer').style.display = 'block';
                    if(!animationId) animate();
                } else {
                    isLocked = false;
                    isPaused = true;
                    document.getElementById('ui-layer').style.display = 'none';
                    document.getElementById('pause-screen').style.display = 'flex';
                }
            });

            // Keyboard
            document.addEventListener('keydown', (e) => {
                if(!isLocked) return;
                switch(e.code) {
                    case 'KeyW': moveState.forward = true; break;
                    case 'KeyS': moveState.backward = true; break;
                    case 'KeyA': moveState.left = true; break;
                    case 'KeyD': moveState.right = true; break;
                    case 'Space': 
                        if(player.canJump && !player.isCharging) { 
                            player.velocity.y = 15; player.canJump = false; 
                        } 
                        break;
                    case 'ShiftLeft': handleCharge(); break;
                    case 'KeyE': handleSlowProjectile(); break;
                    case 'KeyQ': handleUltimate(); break;
                    case 'KeyR': handleReload(); break;
                    case 'KeyV': handleMelee(); break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': moveState.forward = false; break;
                    case 'KeyS': moveState.backward = false; break;
                    case 'KeyA': moveState.left = false; break;
                    case 'KeyD': moveState.right = false; break;
                }
            });

            // Mouse Look
            const euler = new THREE.Euler(0, 0, 0, 'YXZ');
            document.addEventListener('mousemove', (event) => {
                if (!isLocked) return;
                const movementX = event.movementX || 0;
                const movementY = event.movementY || 0;

                euler.setFromQuaternion(camera.quaternion);
                euler.y -= movementX * 0.002;
                euler.x -= movementY * 0.002;
                euler.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, euler.x));
                camera.quaternion.setFromEuler(euler);
            });

            // Mouse Clicks
            document.addEventListener('mousedown', (e) => {
                if(!isLocked) return;
                if(player.isCharging || player.isReloading) return;

                if(e.button === 0) { // Left Click
                    handleShoot();
                } else if (e.button === 2) { // Right Click
                    handleHook();
                }
            });

            document.addEventListener('contextmenu', e => e.preventDefault());
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Menu Buttons
            document.getElementById('add-bot-btn').addEventListener('click', spawnBot);
            document.getElementById('rem-bot-btn').addEventListener('click', removeBot);
        }

        // --- Action Handlers ---

        function handleShoot() {
            if(player.ammo <= 0) {
                handleReload(); return;
            }

            player.ammo--;
            updateAmmoUI();

            // Fire muzzle effect
            muzzleFlash.opacity = 1.0;
            muzzleFlash.rotation.z = Math.random() * Math.PI;

            // Recoil
            weaponGroup.position.z += 0.12;
            weaponGroup.rotation.x += 0.07;
            setTimeout(() => {
                weaponGroup.position.z -= 0.12;
                weaponGroup.rotation.x -= 0.07;
            }, 60);

            // Raycast Shoot
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            
            let hitBot = null;
            let minDist = 1000;
            let hitPoint = new THREE.Vector3();

            bots.forEach(bot => {
                const sphere = new THREE.Sphere(bot.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 1.3);
                const intersect = raycaster.ray.intersectSphere(sphere, new THREE.Vector3());
                if(intersect) {
                    const dist = camera.position.distanceTo(intersect);
                    if(dist < minDist && !isObstructed(camera.position, intersect)) {
                        minDist = dist;
                        hitBot = bot;
                        hitPoint.copy(intersect);
                    }
                }
            });

            const tracerEnd = hitBot ? hitPoint : camera.position.clone().add(raycaster.ray.direction.multiplyScalar(100));
            
            // Draw Beautiful Neon Tracer Line
            drawLineTracer(weaponGroup.getWorldPosition(new THREE.Vector3()), tracerEnd, 0x00ffff, 80);

            if(hitBot) {
                // Damage calculation with distance falloff (상대와의 거리 비례 데미지 감쇠)
                // < 10m: 25 damage, > 50m: 5 damage
                let finalDmg = 25;
                if (minDist > 10) {
                    const progress = Math.min(1.0, (minDist - 10) / 40);
                    finalDmg = Math.floor(THREE.MathUtils.lerp(25, 5, progress));
                }

                damageBot(hitBot, finalDmg);
                addUltCharge(finalDmg * 0.4);
                createParticles(hitPoint, 0x00ffff, 8);
            }
        }

        function handleReload() {
            if(player.isReloading || player.ammo === player.maxAmmo) return;
            player.isReloading = true;
            
            weaponGroup.position.y -= 0.5;
            weaponGroup.rotation.x -= 0.4;
            
            setTimeout(() => {
                player.ammo = player.maxAmmo;
                player.isReloading = false;
                weaponGroup.position.y += 0.5;
                weaponGroup.rotation.x += 0.4;
                updateAmmoUI();
            }, 1000);
        }

        function handleMelee() {
            if(player.cooldowns.melee > 0) return;
            player.cooldowns.melee = player.maxCooldowns.melee;
            
            // Slash Crescent animation
            slashMesh.material.opacity = 0.9;
            slashMesh.rotation.z = Math.random() * Math.PI;
            
            weaponGroup.position.x += 0.4;
            weaponGroup.rotation.y += 0.4;
            setTimeout(() => {
                weaponGroup.position.x -= 0.4;
                weaponGroup.rotation.y -= 0.4;
                slashMesh.material.opacity = 0;
            }, 150);

            // Hit logic
            const lookDir = camera.getWorldDirection(new THREE.Vector3());
            bots.forEach(bot => {
                const dist = camera.position.distanceTo(bot.mesh.position);
                if(dist < 5.5) {
                    const dirToBot = new THREE.Vector3().subVectors(bot.mesh.position, camera.position).normalize();
                    if(dirToBot.dot(lookDir) > 0.6) {
                        damageBot(bot, 20);
                        addUltCharge(8);
                        // Knockback (약간의 넉백)
                        bot.velocity.add(dirToBot.multiplyScalar(22));
                        bot.velocity.y = 6;
                    }
                }
            });
        }

        function handleHook() {
            if(player.cooldowns.hook > 0) return;
            player.cooldowns.hook = player.maxCooldowns.hook;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            
            let target = null;
            let minDist = 45; // Increased range

            bots.forEach(bot => {
                const sphere = new THREE.Sphere(bot.mesh.position.clone().add(new THREE.Vector3(0,1.2,0)), 1.8);
                const intersect = raycaster.ray.intersectSphere(sphere, new THREE.Vector3());
                if(intersect) {
                    const dist = camera.position.distanceTo(intersect);
                    if(dist < minDist && !isObstructed(camera.position, intersect)) {
                        minDist = dist; target = bot;
                    }
                }
            });

            const startPos = weaponGroup.getWorldPosition(new THREE.Vector3());
            const endPt = target ? target.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0)) : 
                                   camera.position.clone().add(raycaster.ray.direction.multiplyScalar(35));
            
            // Draw Chain
            drawHookChain(startPos, endPt);

            if(target) {
                damageBot(target, 30);
                addUltCharge(12);
                
                // PIN AND PULL DIRECTLY IN FRONT (내 코앞까지 완벽 견인)
                target.isPinned = true;
                target.isPulled = true;
                target.pullStart.copy(target.mesh.position);
                target.pullTimer = 0;
            }
        }

        function handleSlowProjectile() {
            if(player.cooldowns.slow > 0) return;
            player.cooldowns.slow = player.maxCooldowns.slow;

            const lookDir = camera.getWorldDirection(new THREE.Vector3());

            // Glowing Purple slow ball
            const geo = new THREE.SphereGeometry(0.35, 16, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xaa00ff, emissive: 0xaa00ff });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(camera.position).add(lookDir.clone().multiplyScalar(1.5));
            scene.add(mesh);

            projectiles.push({
                type: 'slow',
                mesh: mesh,
                velocity: lookDir.multiplyScalar(35),
                radius: 1.4,
                life: 3.0
            });
        }

        function handleCharge() {
            if(player.cooldowns.charge > 0 || player.isCharging) return;
            player.cooldowns.charge = player.maxCooldowns.charge;
            player.isCharging = true;
            player.chargeTimer = 0.65;
            player.chargeTarget = null;
            
            // Screen speed warp effect
            document.getElementById('ui-layer').style.boxShadow = "inset 0 0 60px rgba(0, 255, 255, 0.4)";
            
            // Charge to look direction fully (상/하 공중 이동 포함)
            const lookDir = camera.getWorldDirection(new THREE.Vector3()).normalize();
            player.velocity.copy(lookDir.multiplyScalar(55));
        }

        function handleUltimate() {
            if(player.ultCharge < 100) return;
            player.ultCharge = 0;
            player.isUltActive = true;
            player.ultTimer = 10;
            
            player.maxHealth = 1000;
            player.health += 700;
            updateHealthUI();
            updateUltUI();

            // Cast targeted meteor array
            const lookDir = camera.getWorldDirection(new THREE.Vector3());
            const targetPos = camera.position.clone().add(lookDir.multiplyScalar(28));
            
            // Project Target Ground
            const targetGroundY = getGroundY(targetPos, 10);
            targetPos.y = targetGroundY;

            // 1. VISUAL WARNING CIRCLE (바닥에 붉은색 경고 원 영역 소환)
            createUltWarningZone(targetPos, 12, 2.0);

            // 2. Spawn Meteors in sequence
            setTimeout(() => {
                for(let i=0; i<8; i++) {
                    setTimeout(() => {
                        const angle = (i / 8) * Math.PI * 2;
                        const r = 9;
                        const dropPos = new THREE.Vector3(
                            targetPos.x + Math.cos(angle)*r, 
                            targetPos.y + 45, 
                            targetPos.z + Math.sin(angle)*r
                        );
                        
                        // Cyber giant brick
                        const mat = new THREE.MeshStandardMaterial({ 
                            color: 0xff3300, 
                            emissive: 0xaa1100,
                            metalness: 0.8
                        });
                        const geo = new THREE.BoxGeometry(2.5, 7.5, 2.5);
                        const mesh = new THREE.Mesh(geo, mat);
                        mesh.position.copy(dropPos);
                        scene.add(mesh);
                        
                        projectiles.push({ 
                            type: 'meteor',
                            mesh: mesh, 
                            velocity: new THREE.Vector3(0, -60, 0), 
                            damage: 150, 
                            radius: 7.5,
                            groundY: targetPos.y
                        });
                    }, i * 250);
                }
            }, 600); // slight offset to warning zone appearing
        }

        // --- Utilities ---

        function isObstructed(start, end) {
            const dir = new THREE.Vector3().subVectors(end, start);
            const dist = dir.length();
            dir.normalize();
            const ray = new THREE.Raycaster(start, dir, 0, dist);
            for(let w of walls) {
                if(ray.ray.intersectsBox(w)) return true;
            }
            return false;
        }

        function checkCollision(pos, radius, height) {
            const box = new THREE.Box3().setFromCenterAndSize(
                new THREE.Vector3(pos.x, pos.y - height/2 + 1.2, pos.z),
                new THREE.Vector3(radius*2, height-0.2, radius*2)
            );
            for(let w of walls) {
                if(box.intersectsBox(w)) return true;
            }
            return false;
        }

        function damageBot(bot, amount) {
            bot.health -= amount;
            
            // Flash neon white on damage
            bot.mesh.traverse(c => {
                if(c.isMesh && c.material) {
                    c.material.color.setHex(0xffffff);
                }
            });
            setTimeout(() => {
                if(bot.mesh) {
                    bot.bodyMat.color.setHex(0xdd1144);
                    bot.headMat.color.setHex(0x111122);
                }
            }, 80);

            if(bot.health <= 0) {
                createParticles(bot.mesh.position.clone().add(new THREE.Vector3(0,1.2,0)), 0xff0055, 30);
                scene.remove(bot.mesh);
                const idx = bots.indexOf(bot);
                if(idx > -1) bots.splice(idx, 1);
                updateBotCountUI();
                setTimeout(spawnBot, 3000); // Respawn
            }
        }

        function addUltCharge(amt) {
            if(!player.isUltActive && player.ultCharge < 100) {
                player.ultCharge = Math.min(100, player.ultCharge + amt);
                updateUltUI();
            }
        }

        function createParticles(pos, color, count) {
            const geo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            for(let i=0; i<count; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);
                particles.push({
                    mesh: mesh, life: 1.0,
                    vel: new THREE.Vector3((Math.random()-0.5)*18, Math.random()*15, (Math.random()-0.5)*18)
                });
            }
        }

        function drawLineTracer(start, end, color, duration) {
            const mat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
            const line = new THREE.Line(geo, mat);
            scene.add(line);
            setTimeout(() => scene.remove(line), duration);
        }

        function drawHookChain(start, end) {
            // segmented spheres for chain feeling
            const segments = 15;
            const chainGroup = new THREE.Group();
            const sphereGeo = new THREE.SphereGeometry(0.12, 6, 6);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            
            for(let i=0; i<=segments; i++) {
                const mesh = new THREE.Mesh(sphereGeo, sphereMat);
                mesh.position.lerpVectors(start, end, i / segments);
                chainGroup.add(mesh);
            }
            scene.add(chainGroup);
            setTimeout(() => scene.remove(chainGroup), 250);
        }

        function createUltWarningZone(targetPos, radius, duration) {
            const group = new THREE.Group();
            group.position.copy(targetPos);
            group.position.y += 0.1;
            scene.add(group);

            // Red warning outline ring
            const ringGeo = new THREE.RingGeometry(radius - 0.25, radius, 48);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff1100, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            group.add(ring);

            // Red transparent center
            const circleGeo = new THREE.CircleGeometry(radius - 0.25, 48);
            const circleMat = new THREE.MeshBasicMaterial({ 
                color: 0xff0000, 
                transparent: true, 
                opacity: 0.2, 
                side: THREE.DoubleSide 
            });
            const circle = new THREE.Mesh(circleGeo, circleMat);
            circle.rotation.x = -Math.PI / 2;
            group.add(circle);

            // Pulsating visual feedback loop
            const spawnTime = performance.now();
            function animateWarning() {
                const elapsed = (performance.now() - spawnTime) / 1000;
                if(elapsed < duration) {
                    circleMat.opacity = 0.2 + Math.sin(elapsed * 18) * 0.12; // flicker
                    ring.scale.setScalar(1.0 + Math.sin(elapsed * 4) * 0.05);
                    requestAnimationFrame(animateWarning);
                } else {
                    scene.remove(group);
                }
            }
            animateWarning();
        }

        // --- UI Updates ---

        function updateUI() {
            updateHealthUI();
            updateAmmoUI();
            updateUltUI();
        }

        function updateHealthUI() {
            const text = document.getElementById('health-numbers');
            const bar = document.getElementById('health-bar-fill');
            
            text.innerHTML = `${Math.floor(player.health)}<span>/${player.maxHealth}</span>`;
            const pct = Math.max(0, (player.health / player.maxHealth) * 100);
            bar.style.width = pct + '%';
            
            if(player.isUltActive) {
                bar.style.background = '#ff4400';
                text.style.color = '#ff4400';
            } else {
                bar.style.background = '#00ffff';
                text.style.color = '#fff';
            }
        }

        function updateAmmoUI() {
            document.getElementById('ammo-numbers').innerHTML = `${player.ammo}<span>/${player.maxAmmo}</span>`;
        }

        function updateUltUI() {
            const fill = document.getElementById('ult-circle-fill');
            const num = document.getElementById('ult-number');
            const sec = document.getElementById('ult-section');
            
            fill.style.height = player.ultCharge + '%';
            num.innerText = Math.floor(player.ultCharge);

            if(player.ultCharge >= 100) {
                sec.classList.add('ult-ready');
            } else {
                sec.classList.remove('ult-ready');
            }
        }

        function updateBotCountUI() {
            document.getElementById('bot-count-text').innerText = bots.length;
        }

        function updateCooldownUI(id, current, max) {
            const el = document.getElementById(id);
            if(current > 0) {
                el.style.display = 'flex';
                el.innerText = Math.ceil(current);
            } else {
                el.style.display = 'none';
            }
        }

        // --- Game Main Loop ---

        let animationId;
        function animate() {
            animationId = requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - lastTime) / 1000, 0.1); 
            lastTime = time;

            if(isPaused) return;

            // Muzzle Flash Decay
            if(muzzleFlash.opacity > 0) muzzleFlash.opacity -= delta * 12;

            // Ultimate States
            if(player.isUltActive) {
                player.ultTimer -= delta;
                if(player.ultTimer <= 0) {
                    player.isUltActive = false;
                    player.maxHealth = 300;
                    if(player.health > 300) player.health = 300;
                    updateHealthUI();
                }
            } else {
                addUltCharge(delta * 1.5); // passive tick
            }

            // Cooldowns
            if(player.cooldowns.charge > 0) {
                player.cooldowns.charge -= delta;
                updateCooldownUI('cd-charge', player.cooldowns.charge, player.maxCooldowns.charge);
            }
            if(player.cooldowns.hook > 0) {
                player.cooldowns.hook -= delta;
                updateCooldownUI('cd-hook', player.cooldowns.hook, player.maxCooldowns.hook);
            }
            if(player.cooldowns.melee > 0) {
                player.cooldowns.melee -= delta;
                updateCooldownUI('cd-melee', player.cooldowns.melee, player.maxCooldowns.melee);
            }
            if(player.cooldowns.slow > 0) {
                player.cooldowns.slow -= delta;
                updateCooldownUI('cd-slow', player.cooldowns.slow, player.maxCooldowns.slow);
            }

            // Direction inputs
            player.direction.x = Number(moveState.right) - Number(moveState.left);
            player.direction.z = Number(moveState.backward) - Number(moveState.forward);
            player.direction.normalize();

            // Handling Action - CHARGING (L-SHIFT)
            if(player.isCharging) {
                player.chargeTimer -= delta;
                
                // Pinning Bots during charge
                const pBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(2.5, 2.5, 2.5));
                if(!player.chargeTarget) {
                    bots.forEach(b => {
                        const bBox = new THREE.Box3().setFromCenterAndSize(
                            b.mesh.position.clone().add(new THREE.Vector3(0,1.2,0)), 
                            new THREE.Vector3(2.0, 2.5, 2.0)
                        );
                        if(pBox.intersectsBox(bBox)) {
                            player.chargeTarget = b;
                            b.isPinned = true;
                            damageBot(b, 20);
                        }
                    });
                } else {
                    // Pull pinned bot along in front
                    const carryPos = camera.position.clone().add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(2.2));
                    player.chargeTarget.mesh.position.copy(carryPos);
                    player.chargeTarget.velocity.set(0,0,0);
                }

                // Check collisions with walls during charge
                const nextPos = camera.position.clone().add(player.velocity.clone().multiplyScalar(delta));
                let hitWall = checkCollision(nextPos, player.radius, player.height);

                if(player.chargeTimer <= 0 || hitWall) {
                    player.isCharging = false;
                    player.velocity.set(0,0,0);
                    document.getElementById('ui-layer').style.boxShadow = "none";
                    
                    if(player.chargeTarget) {
                        player.chargeTarget.isPinned = false;
                        if(hitWall) {
                            damageBot(player.chargeTarget, 70); // Smash damage!
                            addUltCharge(15);
                            createParticles(player.chargeTarget.mesh.position, 0xff0000, 25);
                        } else {
                            damageBot(player.chargeTarget, 10);
                        }
                        player.chargeTarget.velocity.y = 8;
                        player.chargeTarget = null;
                    }
                }
            } else {
                // Apply player standard acceleration
                const speedMult = 65.0;
                player.velocity.x += player.direction.x * speedMult * delta;
                player.velocity.z += player.direction.z * speedMult * delta;
                
                // Friction
                player.velocity.x -= player.velocity.x * 11.0 * delta;
                player.velocity.z -= player.velocity.z * 11.0 * delta;
            }

            // Gravity & Ground Height calculations
            let groundY = getGroundY(camera.position, player.radius);
            
            // Only apply gravity if not charging
            if (!player.isCharging) {
                player.velocity.y -= GRAVITY * delta;
            }

            // --- Movement and Collision Resolution ---
            // Process Y Collision
            camera.position.y += player.velocity.y * delta;
            if(camera.position.y < groundY + player.height) {
                camera.position.y = groundY + player.height;
                player.velocity.y = 0;
                player.canJump = true;
            }

            // Standard horizontal sliding movement & collision checks
            const forward = camera.getWorldDirection(new THREE.Vector3());
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();

            const moveVec = new THREE.Vector3()
                .add(right.clone().multiplyScalar(player.velocity.x * delta))
                .add(forward.clone().multiplyScalar(-player.velocity.z * delta));

            // Try X Movement
            const nextXPos = camera.position.clone();
            nextXPos.x += moveVec.x;
            if(!checkCollision(nextXPos, player.radius, player.height)) {
                camera.position.x = nextXPos.x;
            }

            // Try Z Movement
            const nextZPos = camera.position.clone();
            nextZPos.z += moveVec.z;
            if(!checkCollision(nextZPos, player.radius, player.height)) {
                camera.position.z = nextZPos.z;
            }

            // --- Update Bots & AI ---
            bots.forEach(bot => {
                // Billboard Health Bars orientation matching camera
                if (bot.hpGroup) {
                    bot.hpGroup.quaternion.copy(camera.quaternion);
                    // smoothly scale HP foreground bar
                    bot.hpFg.scale.x = Math.max(0, bot.health / bot.maxHealth);
                }

                // If pulled by hook, smooth interpolate straight to player's face
                if (bot.isPulled) {
                    bot.pullTimer += delta;
                    const t = Math.min(1.0, bot.pullTimer / bot.pullDuration);
                    
                    const lookDir = camera.getWorldDirection(new THREE.Vector3()).normalize();
                    // Landing point: exactly 2.6m in front of camera
                    const targetPullPos = camera.position.clone().add(lookDir.multiplyScalar(2.6));
                    targetPullPos.y = Math.max(0.1, targetPullPos.y - 1.2); // ground alignment
                    
                    bot.mesh.position.lerpVectors(bot.pullStart, targetPullPos, t);
                    bot.velocity.set(0,0,0);

                    if (t >= 1.0) {
                        bot.isPulled = false;
                        bot.isPinned = false;
                    }
                    return; // Skip standard movement
                }

                if(bot.isPinned) return;

                // Handle Slow debuffs (시간이 지날수록 원래 이동속도로 점차 회복)
                if (bot.slowTimer > 0) {
                    bot.slowTimer -= delta;
                    bot.slowFactor = THREE.MathUtils.lerp(1.0, 0.2, bot.slowTimer / 4.0);
                    // purple neon hologram tint
                    bot.bodyMat.emissive.setHex(0x3d007a);
                } else {
                    bot.slowFactor = 1.0;
                    bot.bodyMat.emissive.setHex(0x000000);
                }

                // Bot Standard Wandering AI
                bot.moveTimer -= delta;
                if(bot.moveTimer <= 0) {
                    bot.moveTimer = 2.5;
                    bot.targetDir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize();
                }

                // Apply Slow Factor to speeds
                const moveSpeed = 15.0 * bot.slowFactor;
                bot.velocity.x += bot.targetDir.x * moveSpeed * delta;
                bot.velocity.z += bot.targetDir.z * moveSpeed * delta;
                bot.velocity.x -= bot.velocity.x * 5 * delta;
                bot.velocity.z -= bot.velocity.z * 5 * delta;
                bot.velocity.y -= GRAVITY * delta;

                // Bot Vertical Collision
                const botGroundY = getGroundY(bot.mesh.position, bot.radius);
                bot.mesh.position.y += bot.velocity.y * delta;
                if(bot.mesh.position.y < botGroundY) {
                    bot.mesh.position.y = botGroundY; bot.velocity.y = 0;
                }

                // Bot Horizontal Wall Collisions
                const bNextX = bot.mesh.position.clone(); bNextX.x += bot.velocity.x * delta;
                if(!checkCollision(new THREE.Vector3(bNextX.x, bot.mesh.position.y + 1.2, bNextX.z), bot.radius, bot.height)) {
                    bot.mesh.position.x = bNextX.x;
                }

                const bNextZ = bot.mesh.position.clone(); bNextZ.z += bot.velocity.z * delta;
                if(!checkCollision(new THREE.Vector3(bNextZ.x, bot.mesh.position.y + 1.2, bNextZ.z), bot.radius, bot.height)) {
                    bot.mesh.position.z = bNextZ.z;
                }
            });

            // --- Update Projectiles (Meteors & Slow Orbs) ---
            for(let i=projectiles.length-1; i>=0; i--) {
                const p = projectiles[i];
                p.mesh.position.add(p.velocity.clone().multiplyScalar(delta));
                
                if (p.type === 'slow') {
                    p.life -= delta;
                    // Spawn glowing trail particles
                    createParticles(p.mesh.position, 0xaa00ff, 1);
                    
                    let hitAny = false;
                    bots.forEach(bot => {
                        if (p.mesh.position.distanceTo(bot.mesh.position.clone().add(new THREE.Vector3(0,1.2,0))) < p.radius) {
                            // Apply slow debuff
                            bot.slowTimer = 4.0;
                            bot.slowFactor = 0.2;
                            hitAny = true;
                            damageBot(bot, 15);
                            createParticles(p.mesh.position, 0xaa00ff, 15);
                        }
                    });

                    if (p.life <= 0 || hitAny) {
                        scene.remove(p.mesh);
                        projectiles.splice(i, 1);
                    }
                } 
                else if (p.type === 'meteor') {
                    // Check hitting its targeted ground level
                    if(p.mesh.position.y <= p.groundY + 2.5) {
                        // Impact!
                        createParticles(p.mesh.position, 0xff3300, 35);
                        
                        // Blast ring wave visual
                        const waveGeo = new THREE.RingGeometry(0.1, p.radius, 32);
                        const waveMat = new THREE.MeshBasicMaterial({ color: 0xff3300, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                        const wave = new THREE.Mesh(waveGeo, waveMat);
                        wave.rotation.x = -Math.PI / 2;
                        wave.position.copy(p.mesh.position);
                        wave.position.y = p.groundY + 0.1;
                        scene.add(wave);

                        // Expand and fade ring wave
                        let expandLife = 1.0;
                        function expandWave() {
                            expandLife -= 0.05;
                            if(expandLife > 0) {
                                wave.scale.addScalar(0.15);
                                waveMat.opacity = expandLife;
                                requestAnimationFrame(expandWave);
                            } else {
                                scene.remove(wave);
                            }
                        }
                        expandWave();

                        bots.forEach(bot => {
                            if(bot.mesh.position.distanceTo(p.mesh.position) < p.radius) {
                                damageBot(bot, p.damage);
                            }
                        });
                        
                        // Screen damage indicator if player close
                        const distToPlayer = camera.position.distanceTo(p.mesh.position);
                        if(distToPlayer < p.radius * 2) {
                            const screenFlash = document.getElementById('damage-overlay');
                            screenFlash.style.boxShadow = "inset 0 0 100px rgba(255,0,0,0.6)";
                            setTimeout(() => { screenFlash.style.boxShadow = "none"; }, 150);
                        }

                        scene.remove(p.mesh);
                        projectiles.splice(i, 1);
                    }
                }
            }

            // --- Update Particles ---
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.life -= delta * 1.6;
                if(p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                } else {
                    p.vel.y -= GRAVITY * delta;
                    p.mesh.position.add(p.vel.clone().multiplyScalar(delta));
                    p.mesh.scale.setScalar(p.life);
                }
            }

            renderer.render(scene, camera);
        }
    </script>
